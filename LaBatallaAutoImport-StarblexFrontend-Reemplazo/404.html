<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada | La Batalla Auto Import</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#38bdf8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js" integrity="sha384-JNhb/AfQ8tCvhjfm2WXKx9qovmn7LcndXYllHYDf2CcTBaBMAiPsjRJeC3f9U8V6" crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: rgb(15, 23, 42);
      color: rgb(226, 232, 240);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .box { text-align: center; max-width: 440px; }
    .icon { width: 72px; height: 72px; color: #38bdf8; margin: 0 auto 20px; opacity: 0.85; }
    h1 { color: #f8fafc; font-size: 26px; font-weight: 800; margin-bottom: 10px; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 28px; line-height: 1.6; }
    a.btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 800;
      padding: 12px 28px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 14px;
      transition: transform 0.15s;
    }
    a.btn:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="box">
    <i data-lucide="search-x" class="icon"></i>
    <h1>Página no encontrada</h1>
    <p>La página que buscas no existe o fue movida. Puede que el enlace esté roto o desactualizado.</p>
    <a class="btn" href="/">
      <i data-lucide="arrow-left" style="width:16px;height:16px;"></i>
      Volver a La Batalla Auto Import
    </a>
  </div>
  <script>window.addEventListener('DOMContentLoaded', () => { if (window.lucide) lucide.createIcons(); });</script>
</body>
</html>
