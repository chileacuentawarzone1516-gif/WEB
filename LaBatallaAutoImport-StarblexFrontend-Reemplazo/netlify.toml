# ============================================================
# netlify.toml — Configuración de Netlify
# ============================================================
# IMPORTANTE: este archivo hace TRES cosas necesarias:
#
# 1. Redirect SPA — sin esto, entrar directo a /vehiculos/algun-slug
#    daría 404 en Netlify (a diferencia de GitHub Pages, Netlify NO
#    hace fallback automático a index.html).
#
# 2. Edge Function — intercepta las peticiones a /vehiculos/* para
#    inyectar meta tags dinámicas SOLO cuando quien pide la página
#    es un bot de redes sociales (WhatsApp, Facebook, Twitter, etc),
#    y para devolver un 404 real cuando el vehículo no existe.
#
# 3. Cache headers — desde que separamos el CSS y JS en archivos
#    propios (styles.css / app.js / calculadora.js), el navegador
#    puede guardarlos en caché entre visitas. Esto acelera la carga
#    en visitas repetidas sin afectar cuando actualizas el contenido,
#    porque Netlify invalida la caché automáticamente en cada deploy.

[build]
  # Respaldo: regenera el sitemap en cada deploy además del cron diario
  # de GitHub Actions. El `|| true` evita que esto bloquee el deploy —
  # el sitio sigue publicándose con el último sitemap.xml válido conocido
  # si Firestore no responde en ese momento.
  command = "node scripts/generar-sitemap.js || true"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# Redirect 301 permanente — la antigua URL /terminos-condiciones.html
# (archivo duplicado ya eliminado) apunta a la versión canónica.
# Preserva cualquier enlace externo o indexación previa sin generar
# contenido duplicado ante Google.
[[redirects]]
  from = "/terminos-condiciones.html"
  to = "/terminos-y-condiciones.html"
  status = 301

# El Dashboard es una vista de la SPA — servir index.html para entrada
# directa (refresh, marcador, link compartido). Sin esto, /dashboard da 404.
[[redirects]]
  from = "/dashboard"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/vehiculos/*"
  to = "/index.html"
  status = 200

# ============================================================
# SUBPÁGINAS DE EMPRESA — ya NO son vistas de la SPA.
# ------------------------------------------------------------
# Cada sección es un documento HTML propio en /empresa/*.html, con su
# <title>, canonical, Open Graph y JSON-LD escritos en el HTML. Esto
# elimina dos problemas reales de la versión anterior (todas las rutas
# servían index.html): el contenido solo existía tras ejecutar JS, y
# cualquier /empresa/loquesea devolvía 200 con la home dentro (soft 404).
#
# Las reescrituras 200 hacen explícito el mapeo URL limpia → archivo,
# sin depender de la heurística de "pretty URLs" de Netlify. El comodín
# final va después de las cuatro rutas válidas: el orden importa,
# gana la primera regla que coincide.
# ============================================================
[[redirects]]
  from = "/empresa"
  to = "/empresa/quienes-somos"
  status = 301

[[redirects]]
  from = "/empresa/por-que-elegirnos"
  to = "/empresa/por-que-elegirnos.html"
  status = 200

[[redirects]]
  from = "/empresa/quienes-somos"
  to = "/empresa/quienes-somos.html"
  status = 200

[[redirects]]
  from = "/empresa/mision-vision"
  to = "/empresa/mision-vision.html"
  status = 200

[[redirects]]
  from = "/empresa/nuestros-valores"
  to = "/empresa/nuestros-valores.html"
  status = 200

[[redirects]]
  from = "/empresa/*"
  to = "/404.html"
  status = 404

# ============================================================
# ARCHIVOS INTERNOS QUE NO DEBEN SERVIRSE
# ------------------------------------------------------------
# `publish = "."` publica TODA la carpeta, así que hoy son
# descargables /firestore.rules, /firestore_rules_test.js,
# /firebase.json, /cloudinary-sign-worker.js, /README.md,
# /RELEASE_NOTES.md y el árbol /netlify/ (código de la Edge Function
# y de la Function de correo). Ninguno lo carga el sitio (verificado: 0
# referencias en index.html y ningún <script> los pide), pero
# entre todos publican el detalle de las reglas de seguridad, la
# lógica de firma de Cloudinary y la deuda de seguridad conocida
# —un mapa cómodo para quien quiera atacar el sitio—.
#
# No son secretos (los correos de la whitelist ya viven en auth.js
# por diseño, porque el cliente los necesita), pero tampoco hay
# ninguna razón para servirlos: se devuelven 404.
#
# `force = true` es imprescindible: sin él, Netlify sirve el
# archivo estático y el redirect nunca se aplica.
# ============================================================
[[redirects]]
  from = "/firestore.rules"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/firestore_rules_test.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/firebase.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/cloudinary-sign-worker.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/RELEASE_NOTES.md"
  to = "/404.html"
  status = 404
  force = true

# Código fuente de las funciones. No afecta a su ejecución: Netlify las
# expone en /.netlify/functions/* (con punto), que es otra ruta.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[edge_functions]]
  path = "/vehiculos/*"
  function = "vehicle-og"

# ============================================================
# FUNCIONES DE SERVIDOR
# ------------------------------------------------------------
# `publish = "."` publica todo el árbol del repositorio, así que la
# carpeta netlify/ también quedaría servida como archivos estáticos.
# El código fuente ya es público en GitHub y no contiene secretos (las
# claves viven en variables de entorno), pero no hay ninguna razón para
# servirlo: se devuelve 404. No afecta a las funciones, que Netlify
# expone en /.netlify/functions/* — otra ruta distinta.
# ============================================================
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# La copia por correo de una cotización nunca debe quedar cacheada.
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Módulos extraídos de app.js (carrusel del hero y subida de medios) —
# mismo patrón de caché que el resto de JS propio: corto con
# revalidación; el versionado ?v= del <script> fuerza el refresh.
[[headers]]
  for = "/hero-carousel.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/media-upload.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Normalizador único del campo `media` (lo usan app.js y dashboard.js).
[[headers]]
  for = "/media-model.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/calculadora.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Generador de la cotización en PDF. Son módulos ES cargados con import()
# dinámico desde calculadora.js (no van en el <head>), así que su caché
# se invalida por el ?v= del propio import.
[[headers]]
  for = "/cotizacion-pdf.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/pdf-core.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Estilos de la ficha de vehículo (especificaciones y características).
[[headers]]
  for = "/ficha-vehiculo.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/vehicles-demo.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# sitemap.xml se regenera a diario vía GitHub Action (y en cada deploy
# vía [build]) — cache corto para que Google siempre vea la versión
# más reciente.
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"
    Content-Type = "application/manifest+json; charset=utf-8"

# Logo/favicon/preview/iconos cambian rara vez — cache largo.
[[headers]]
  for = "/icon192.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/icon512.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/favicon.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

# Portada social canónica (og:image de index.html y de las páginas de
# Empresa, y respaldo de la Edge Function de /vehiculos/*).
[[headers]]
  for = "/og-cover.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

# /preview.jpg es la RUTA HEREDADA de la portada social. Ya no la declara
# ninguna página, pero las tarjetas de WhatsApp/Facebook compartidas antes
# del cambio siguen apuntando aquí, así que el archivo se mantiene
# publicado (regenerado con la marca actual) en vez de devolver 404.
# `must-revalidate` es justo lo que hace que esos rastreadores obtengan la
# versión nueva en cuanto revaliden.
[[headers]]
  for = "/preview.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

# ============================================================
# HEADERS DE SEGURIDAD — aplican a TODAS las rutas del sitio.
# Protegen contra clickjacking, sniffing de tipo MIME, fuga de
# referrer y ejecución de recursos externos no autorizados.
#
# ⚠️ La Content-Security-Policy está armada según los dominios
# externos que el sitio usa HOY (Firebase, Cloudinary, Cloudflare
# Worker, Google Analytics/Tag Manager, fuentes de Google, íconos de
# jsDelivr, imágenes de Pexels/placehold.co). Si agregas un nuevo
# servicio externo más adelante, tendrás que sumarlo aquí o el
# navegador lo bloqueará silenciosamente.
#
# `blob:` en img-src y media-src NO es opcional: el formulario de
# publicación genera la vista previa de cada foto/vídeo elegido con
# URL.createObjectURL(file) (app.js), que produce una URL `blob:`.
# Sin este permiso el navegador bloquea la miniatura y el admin
# publica a ciegas — verificado en navegador con esta misma política.
# Un `blob:` solo puede crearlo la propia página desde un archivo que
# la persona ya seleccionó; no abre la puerta a ningún origen externo.
# ============================================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; script-src 'self' https://www.gstatic.com https://cdn.jsdelivr.net https://www.google.com https://www.googletagmanager.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src blob: https:; connect-src 'self' https://*.googleapis.com https://*.google.com https://*.gstatic.com https://api.cloudinary.com https://res.cloudinary.com https://labatalla-cloudinary-sign.chileacuentawarzone1516.workers.dev https://www.googletagmanager.com https://www.google-analytics.com https://region1.google-analytics.com; frame-src https://www.google.com https://la-batalla-auto-import.firebaseapp.com; frame-ancestors 'none'; object-src 'none'; form-action 'self'; manifest-src 'self'"

# Archivos nuevos de la Fase 1 (auth + dashboard) — mismo patrón de caché
# que app.js: corto con revalidación, el versionado ?v= fuerza el refresh.
[[headers]]
  for = "/roles.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/auth.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/auth-ui.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/dashboard.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Invitación opcional de registro/login (Fase 1.7) — mismo patrón que
# los demás JS propios.
[[headers]]
  for = "/invite-modal.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Logo usado únicamente dentro del modal de invitación — cambia rara
# vez, mismo patrón que icon192/icon512/favicon.
[[headers]]
  for = "/logo-labatalla.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/dashboard.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Hoja compartida por las páginas HTML estáticas (Empresa + legales).
[[headers]]
  for = "/pagina-estatica.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Scripts extraídos del HTML al retirar script-src 'unsafe-inline' del CSP:
# iconos.js (init de Lucide, compartido por las 7 páginas estáticas) y
# analytics.js (GA4 en index.html). Mismo patrón que el resto de JS propio.
[[headers]]
  for = "/iconos.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/analytics.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# ============================================================
# CACHÉ — recursos que faltaban (auditoría final)
# ------------------------------------------------------------
# tailwind.css y logo-hero.png se piden en TODAS las visitas desde
# index.html y no tenían ninguna regla, así que se servían con la
# heurística por defecto de Netlify en vez de con la política explícita
# que ya usa el resto de archivos propios. Los favicons y el
# apple-touch-icon estaban en la misma situación.
# ============================================================
[[headers]]
  for = "/tailwind.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# logo-hero.png (68 KB) se muestra sobre el hero en la primera pantalla
# de cada visita y prácticamente nunca cambia — mismo trato que el resto
# de iconos de marca.
[[headers]]
  for = "/logo-hero.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

# Marca pequeña (96 px) de la cabecera de la ficha y del panel de cuenta.
# Sustituye al logo que se pedía a Cloudinary y que ya no resolvía.
[[headers]]
  for = "/logo-mark-96.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/favicon-16.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/favicon-32.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/favicon-48.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"
