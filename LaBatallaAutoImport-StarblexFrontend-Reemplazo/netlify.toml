# ============================================================
# netlify.toml — Configuración de Netlify
# ============================================================
# IMPORTANTE: este archivo hace TRES cosas necesarias:
#
# 1. Redirect SPA — sin esto, entrar directo a /vehiculos/algun-slug
#    daría 404 en Netlify (a diferencia de GitHub Pages, Netlify NO
#    hace fallback automático a index.html).
#
# 2. Edge Function — intercepta las peticiones a /vehiculos/* para
#    inyectar meta tags dinámicas SOLO cuando quien pide la página
#    es un bot de redes sociales (WhatsApp, Facebook, Twitter, etc),
#    y para devolver un 404 real cuando el vehículo no existe.
#
# 3. Cache headers — desde que separamos el CSS y JS en archivos
#    propios (styles.css / app.js / calculadora.js), el navegador
#    puede guardarlos en caché entre visitas. Esto acelera la carga
#    en visitas repetidas sin afectar cuando actualizas el contenido,
#    porque Netlify invalida la caché automáticamente en cada deploy.

[build]
  # Respaldo: regenera el sitemap en cada deploy además del cron diario
  # de GitHub Actions. El `|| true` evita que esto bloquee el deploy —
  # el sitio sigue publicándose con el último sitemap.xml válido conocido
  # si Firestore no responde en ese momento.
  command = "node scripts/generar-sitemap.js || true"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# Redirect 301 permanente — la antigua URL /terminos-condiciones.html
# (archivo duplicado ya eliminado) apunta a la versión canónica.
# Preserva cualquier enlace externo o indexación previa sin generar
# contenido duplicado ante Google.
[[redirects]]
  from = "/terminos-condiciones.html"
  to = "/terminos-y-condiciones.html"
  status = 301

# El Dashboard es una vista de la SPA — servir index.html para entrada
# directa (refresh, marcador, link compartido). Sin esto, /dashboard da 404.
[[redirects]]
  from = "/dashboard"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/vehiculos/*"
  to = "/index.html"
  status = 200

# Redirect SPA — las subpáginas de Empresa (/empresa/quienes-somos,
# /empresa/mision-vision, etc.) viven dentro de index.html y se
# resuelven con routing en el cliente (app.js → routeFromLocation).
# Sin esto, entrar directo a cualquier URL /empresa/* daría 404.
[[redirects]]
  from = "/empresa/*"
  to = "/index.html"
  status = 200

[[edge_functions]]
  path = "/vehiculos/*"
  function = "vehicle-og"

# Starblex IA 1.0 — backend seguro del chat automotriz. La API key del
# proveedor de IA vive SOLO como variable de entorno de esta función
# (ANTHROPIC_API_KEY, ALLOWED_ORIGINS) — nunca en el cliente. Mismo
# dominio que el resto del sitio, así que no requiere cambios de CSP
# ni de CORS externo.
[[edge_functions]]
  path = "/api/starblex"
  function = "starblex"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/calculadora.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/vehicles-demo.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# sitemap.xml se regenera a diario vía GitHub Action (y en cada deploy
# vía [build]) — cache corto para que Google siempre vea la versión
# más reciente.
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"
    Content-Type = "application/manifest+json; charset=utf-8"

# Logo/favicon/preview/iconos cambian rara vez — cache largo.
[[headers]]
  for = "/icon192.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/icon512.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/favicon.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/preview.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

# ============================================================
# HEADERS DE SEGURIDAD — aplican a TODAS las rutas del sitio.
# Protegen contra clickjacking, sniffing de tipo MIME, fuga de
# referrer y ejecución de recursos externos no autorizados.
#
# ⚠️ La Content-Security-Policy está armada según los dominios
# externos que el sitio usa HOY (Firebase, Cloudinary, Cloudflare
# Worker, Google Analytics/Tag Manager, fuentes de Google, íconos de
# jsDelivr, imágenes de Pexels/placehold.co). Si agregas un nuevo
# servicio externo más adelante, tendrás que sumarlo aquí o el
# navegador lo bloqueará silenciosamente.
# ============================================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://cdn.jsdelivr.net https://www.google.com https://www.googletagmanager.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src https:; connect-src 'self' https://*.googleapis.com https://*.google.com https://*.gstatic.com https://api.cloudinary.com https://res.cloudinary.com https://labatalla-cloudinary-sign.chileacuentawarzone1516.workers.dev https://www.googletagmanager.com https://www.google-analytics.com https://region1.google-analytics.com; frame-src https://www.google.com https://la-batalla-auto-import.firebaseapp.com; frame-ancestors 'none'; object-src 'none'; form-action 'self'; manifest-src 'self'"

# Archivos nuevos de la Fase 1 (auth + dashboard) — mismo patrón de caché
# que app.js: corto con revalidación, el versionado ?v= fuerza el refresh.
[[headers]]
  for = "/roles.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/auth.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/auth-ui.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/dashboard.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Invitación opcional de registro/login (Fase 1.7) — mismo patrón que
# los demás JS propios.
[[headers]]
  for = "/invite-modal.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Interfaz de Starblex IA 1.0 — mismo patrón que los demás JS propios.
[[headers]]
  for = "/starblex-chat.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Logo usado únicamente dentro del modal de invitación — cambia rara
# vez, mismo patrón que icon192/icon512/favicon.
[[headers]]
  for = "/logo-labatalla.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/dashboard.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
