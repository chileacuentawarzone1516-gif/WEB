# .github/workflows/weekly-audit.yml
# Auditoría semanal automática + auto-fix crítico + PR de mejoras
# Modelo: qwen2.5-coder:7b (q4_k_m default, ~4.7 GB, especialista en código)

name: Weekly Code Audit & Auto-Fix

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-fix:
    name: Audit, Fix & Create PR
    runs-on: ubuntu-latest
    timeout-minutes: 35
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Start Ollama & pull qwen2.5-coder:7b
        run: |
          docker run -d --name ollama -p 11434:11434 ollama/ollama:latest
          for i in {1..30}; do
            curl -sf http://localhost:11434/api/version && break
            sleep 2
          done
          docker exec ollama ollama pull qwen2.5-coder:7b

      - name: Collect key source files
        id: collect
        run: |
          # Solo archivos clave (evita 783 KB → ~150 KB)
          KEY_FILES="
          app.js
          auth.js
          auth-ui.js
          dashboard.js
          calculadora.js
          cotizacion-pdf.js
          boot.js
          media-model.js
          media-upload.js
          roles.js
          firestore.rules
          firebase.json
          netlify.toml
          index.html
          styles.css
          dashboard.css
          ficha-vehiculo.css
          pagina-estatica.css
          invite-modal.js
          cloudinary-sign-worker.js
          vehicles-demo.js
          analytics.js
          404.html
          politica-privacidad.html
          terminos-y-condiciones.html
          robots.txt
          sitemap.xml
          site.webmanifest
          "
          
          CONTEXT=""
          for f in $KEY_FILES; do
            if [ -f "$f" ]; then
              SIZE=$(wc -c < "$f")
              if [ "$SIZE" -lt 80000 ]; then
                CONTEXT+="\n=== FILE: $f ===\n$(cat "$f")\n"
              else
                CONTEXT+="\n=== FILE: $f (TRUNCADO) ===\n$(head -c 60000 "$f")\n... [truncado] ...\n"
              fi
            fi
          done
          
          echo "$CONTEXT" > audit_context.txt
          echo "context<<EOF" >> $GITHUB_OUTPUT
          echo "$CONTEXT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "📊 Archivos clave: $(echo "$KEY_FILES" | wc -w)"
          echo "📏 Tamaño contexto: $(wc -c < audit_context.txt) bytes"

      - name: Run AI code audit
        id: audit
        env:
          OLLAMA_HOST: http://localhost:11434
        run: |
          # Prompt corto y efectivo (evita problemas de expansión shell)
          cat > audit_prompt.txt << 'AUDIT_PROMPT'
Eres auditor senior de código web. Analiza el código y devuelve SOLO JSON válido:

{
  "critical": [{"file": "ruta", "line": 1, "issue": "problema", "fix": "código corregido"}],
  "improvements": [{"file": "ruta", "priority": "high|medium|low", "category": "performance|security|a11y|seo|maintainability", "suggestion": "mejora"}],
  "summary": "Resumen 3 líneas"
}

CRÍTICOS (auto-fix):
- Bugs que rompen funcionalidad
- Vulnerabilidades XSS, reglas Firestore abiertas, secrets
- Errores sintaxis, imports rotos

MEJORAS (PR para revisión):
- Performance: lazy loading, preconnect, caching
- SEO: meta tags, structured data, headings
- Seguridad: CSP, App Check, Firestore least-privilege
- A11y: alt, labels, contraste, focus
- Modern JS: optional chaining, nullish coalescing
- CSS: container queries, custom properties

Stack: vanilla JS + Firebase + Netlify. No inventes archivos.
AUDIT_PROMPT

          # Guardar contexto en archivo (evita expansión shell)
          echo "${{ steps.collect.outputs.context }}" > audit_context.txt
          
          # Construir payload.json con jq leyendo archivos
          jq -n \
            --arg model "qwen2.5-coder:7b" \
            --rawfile prompt audit_prompt.txt \
            --rawfile context audit_context.txt \
            --argjson stream false \
            --argjson format '"json"' \
            --argjson temperature 0.1 \
            --argjson top_p 0.9 \
            --argjson num_ctx 16384 \
            --argjson num_predict 4096 \
            '{model: $model, prompt: ($prompt + "\n\n=== CONTEXTO ===\n" + $context), stream: $stream, format: $format, options: {temperature: $temperature, top_p: $top_p, num_ctx: $num_ctx, num_predict: $num_predict}}' \
            > payload.json
          
          # Llamada a Ollama con timeout de 10 min
          RESPONSE=$(curl -s --max-time 600 -X POST http://localhost:11434/api/generate \
            -H "Content-Type: application/json" \
            -d @payload.json)
          
          echo "$RESPONSE" | jq -r '.response // empty' > audit_result.json
          
          if [ ! -s audit_result.json ]; then
            echo "⚠️ Respuesta vacía del modelo"
            exit 0
          fi
          
          # Limpiar markdown si el modelo lo incluyó
          sed -i 's/```json//g; s/```//g' audit_result.json
          
          if ! jq empty audit_result.json 2>/dev/null; then
            echo "⚠️ No se pudo parsear JSON, guardando respuesta cruda"
            exit 0
          fi
          
          SUMMARY=$(jq -r '.summary // "Sin resumen"' audit_result.json)
          echo "summary<<EOF" >> $GITHUB_OUTPUT
          echo "$SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          CRIT_COUNT=$(jq '.critical | length // 0' audit_result.json)
          IMP_COUNT=$(jq '.improvements | length // 0' audit_result.json)
          echo "🔴 Críticos: $CRIT_COUNT | 🟡 Mejoras: $IMP_COUNT"
          echo "📋 Resumen: $SUMMARY"

      - name: Apply critical fixes
        if: always()
        run: |
          if [ ! -f audit_result.json ] || [ ! -s audit_result.json ]; then
            echo "⚠️ No hay resultados de auditoría"
            exit 0
          fi
          
          CRITICAL=$(jq -c '.critical[]?' audit_result.json 2>/dev/null)
          if [ -z "$CRITICAL" ]; then
            echo "✅ No hay fixes críticos"
            exit 0
          fi
          
          echo "$CRITICAL" | while IFS= read -r issue; do
            FILE=$(echo "$issue" | jq -r '.file // empty' 2>/dev/null)
            FIX=$(echo "$issue" | jq -r '.fix // empty' 2>/dev/null)
            [ -z "$FILE" ] && continue
            [ ! -f "$FILE" ] && echo "⚠️ No existe: $FILE" && continue
            
            echo "🔧 Fix en $FILE"
            cp "$FILE" "$FILE.bak"
            echo "$FIX" > "$FILE"
            
            if [[ "$FILE" == *.js ]]; then
              if ! node --check "$FILE" 2>/dev/null; then
                mv "$FILE.bak" "$FILE"
                echo "❌ Sintaxis rota, restaurado"
              else
                rm "$FILE.bak"
                echo "✅ Fix aplicado"
              fi
            else
              rm "$FILE.bak"
              echo "✅ Fix aplicado"
            fi
          done

      - name: Commit & push critical fixes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if ! git diff --quiet; then
            git add -A
            git commit -m "🤖 Auto-fix: weekly audit $(date +%Y-%m-%d)"
            git push
            echo "✅ Fixes committed"
          else
            echo "ℹ️ No hay cambios"
          fi

      - name: Create Pull Request with improvements
        if: always()
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: audit/improvements-${{ github.run_id }}
          title: "📈 Weekly Audit Improvements — $(date +%Y-%m-%d)"
          body: |
            ## 📋 Mejoras sugeridas por auditoría automática semanal
            
            **Modelo:** qwen2.5-coder:7b  
            **Fecha:** $(date -u +"%Y-%m-%d %H:%M UTC")  
            
            ### Resumen
            ${{ steps.audit.outputs.summary || 'Sin resumen' }}
            
            **⚠️ Revisa cada commit antes de mergear.**
          labels: audit, improvements, automated
          commit-message: "📋 Audit suggestions: ${{ github.run_id }}"
          add-paths: .
          delete-branch: true

      - name: Cleanup Ollama container
        if: always()
        run: docker rm -f ollama 2>/dev/null || true
