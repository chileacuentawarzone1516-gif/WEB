# .github/workflows/weekly-audit.yml
# Auditoría semanal automática + auto-fix crítico + PR de mejoras
# Se ejecuta cada lunes 03:00 UTC (domingo 23:00 en República Dominicana)
# Modelo: qwen2.5-coder:7b (q4_k_m default, ~4.7 GB, especialista en código)

name: Weekly Code Audit & Auto-Fix

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-fix:
    name: Audit, Fix & Create PR
    runs-on: ubuntu-latest
    timeout-minutes: 35
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Start Ollama & pull qwen2.5-coder:7b
        run: |
          docker run -d --name ollama -p 11434:11434 ollama/ollama:latest
          echo "⏳ Esperando a que Ollama inicie..."
          for i in {1..30}; do
            curl -sf http://localhost:11434/api/version && break
            sleep 2
          done
          echo "📥 Descargando modelo (≈4.7 GB)..."
          docker exec ollama ollama pull qwen2.5-coder:7b
          echo "✅ Modelo listo"

      - name: Collect source files for audit
        id: collect
        run: |
          FILES=$(find . -type f \
            \( -name "*.js" -o -name "*.html" -o -name "*.css" -o -name "*.toml" -o -name "*.json" -o -name "*.rules" -o -name "*.md" \) \
            ! -path "./node_modules/*" \
            ! -path "./.git/*" \
            ! -path "./dist/*" \
            ! -path "./build/*" \
            ! -name "*.png" ! -name "*.jpg" ! -name "*.jpeg" ! -name "*.webp" ! -name "*.ico" ! -name "*.svg" \
            ! -name "RELEASE_NOTES.md" \
            | head -80)
          
          CONTEXT=""
          for f in $FILES; do
            SIZE=$(wc -c < "$f")
            if [ "$SIZE" -lt 150000 ]; then
              CONTEXT+="\n=== FILE: $f ===\n$(cat "$f")\n"
            else
              CONTEXT+="\n=== FILE: $f (TRUNCADO - ${SIZE} bytes) ===\n$(head -c 100000 "$f")\n... [archivo truncado para caber en contexto] ...\n"
            fi
          done
          
          echo "$CONTEXT" > audit_context.txt
          echo "context<<EOF" >> $GITHUB_OUTPUT
          echo "$CONTEXT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "📊 Archivos incluidos: $(echo "$FILES" | wc -l)"
          echo "📏 Tamaño contexto: $(wc -c < audit_context.txt) bytes"

      - name: Run AI code audit
        id: audit
        env:
          OLLAMA_HOST: http://localhost:11434
        run: |
          # Prompt codificado en base64 (evita problemas de sintaxis YAML)
          PROMPT_B64=""
          
          # 1. Decodificar prompt a archivo (sin expansión shell)
          echo "$PROMPT_B64" | base64 -d > audit_prompt.txt
          
          # 2. Guardar contexto en archivo (EVITA expansión shell de código JS)
          echo "${{ steps.collect.outputs.context }}" > audit_context.txt
          
          # 3. Construir payload.json con jq LEYENDO ARCHIVOS (sin variables shell)
          #    --rawfile lee el archivo LITERALMENTE (sin parsing JSON)
          #    Perfecto para código con backticks, $(), ${...}, etc.
          jq -n \
            --arg model "qwen2.5-coder:7b" \
            --rawfile prompt audit_prompt.txt \
            --rawfile context audit_context.txt \
            --argjson stream false \
            --argjson format '"json"' \
            --argjson temperature 0.1 \
            --argjson top_p 0.9 \
            --argjson num_ctx 32768 \
            --argjson num_predict 8192 \
            '{model: $model, prompt: ($prompt + "\n\n=== CONTEXTO COMPLETO DEL REPO ===\n" + $context), stream: $stream, format: $format, options: {temperature: $temperature, top_p: $top_p, num_ctx: $num_ctx, num_predict: $num_predict}}' \
            > payload.json
          
          # 4. Llamada a Ollama (usa @payload.json, no heredoc)
          RESPONSE=$(curl -s -X POST http://localhost:11434/api/generate \
            -H "Content-Type: application/json" \
            -d @payload.json)
          
          echo "$RESPONSE" | jq -r '.response' > audit_result.json
          
          # Validar JSON
          if ! jq empty audit_result.json 2>/dev/null; then
            echo "❌ Respuesta no es JSON válido"
            echo "--- Primeros 500 chars ---"
            head -c 500 audit_result.json
            echo ""
            exit 1
          fi
          
          # Extraer resumen para PR
          SUMMARY=$(jq -r '.summary' audit_result.json)
          echo "summary<<EOF" >> $GITHUB_OUTPUT
          echo "$SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          # Contar críticos
          CRIT_COUNT=$(jq '.critical | length' audit_result.json)
          IMP_COUNT=$(jq '.improvements | length' audit_result.json)
          echo "🔴 Críticos: $CRIT_COUNT | 🟡 Mejoras: $IMP_COUNT"
          echo "📋 Resumen: $SUMMARY"

      - name: Apply critical fixes
        if: always()
        run: |
          if [ ! -f audit_result.json ]; then
            echo "⚠️ No hay audit_result.json"
            exit 0
          fi
          
          CRITICAL=$(jq -c '.critical[]' audit_result.json)
          if [ -z "$CRITICAL" ]; then
            echo "✅ No hay fixes críticos que aplicar"
            exit 0
          fi
          
          echo "$CRITICAL" | while IFS= read -r issue; do
            FILE=$(echo "$issue" | jq -r '.file')
            FIX=$(echo "$issue" | jq -r '.fix')
            ISSUE_DESC=$(echo "$issue" | jq -r '.issue')
            
            if [ ! -f "$FILE" ]; then
              echo "⚠️ Archivo no existe: $FILE (saltando)"
              continue
            fi
            
            echo "🔧 Aplicando fix crítico en $FILE: $ISSUE_DESC"
            
            cp "$FILE" "$FILE.bak"
            echo "$FIX" > "$FILE"
            
            if [[ "$FILE" == *.js ]]; then
              if ! node --check "$FILE" 2>/dev/null; then
                echo "❌ Fix rompió sintaxis JS — restaurando backup"
                mv "$FILE.bak" "$FILE"
              else
                rm "$FILE.bak"
                echo "✅ Fix aplicado y verificado"
              fi
            else
              rm "$FILE.bak"
              echo "✅ Fix aplicado"
            fi
          done

      - name: Commit & push critical fixes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if ! git diff --quiet; then
            git add -A
            git commit -m "🤖 Auto-fix: critical issues from weekly audit $(date +%Y-%m-%d)
            
            Fixes aplicados automáticamente por qwen2.5-coder:7b.
            Revisar cambios antes de deploy a producción."
            git push
            echo "✅ Fixes críticos committed & pushed"
          else
            echo "ℹ️ No hay cambios críticos para commitear"
          fi

      - name: Create Pull Request with improvements
        if: always()
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: audit/improvements-${{ github.run_id }}
          title: "📈 Weekly Audit Improvements — $(date +%Y-%m-%d)"
          body: |
            ## 📋 Mejoras sugeridas por auditoría automática semanal
            
            **Modelo:** qwen2.5-coder:7b  
            **Fecha:** $(date -u +"%Y-%m-%d %H:%M UTC")  
            **Commit:** ${{ github.sha }}
            
            ### Resumen ejecutivo
            ${{ steps.audit.outputs.summary }}
            
            ### Cambios propuestos
            Los commits en esta PR contienen mejoras no críticas (performance, SEO, a11y, modern JS, CSS, maintainabilidad, seguridad defensiva).
            
            **⚠️ Revisa cada commit antes de mergear.** Las mejoras son sugerencias; valida que no rompan tu UX ni lógica de negocio.
            
            ### Cómo revisar
            1. Revisa la pestaña "Files changed"
            2. Ejecuta localmente: `git fetch origin audit/improvements-${{ github.run_id }} && git checkout FETCH_HEAD`
            3. Abre `index.html` en navegador o `npx serve .` para test visual
            4. Aprueba y mergea los commits que quieras
          labels: audit, improvements, automated
          commit-message: "📋 Audit suggestions: ${{ github.run_id }}"
          add-paths: .
          delete-branch: true

      - name: Cleanup Ollama container
        if: always()
        run: docker rm -f ollama 2>/dev/null || true
